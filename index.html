<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>FREQ Sounds List</title>
  <link rel="stylesheet" href="style.css?v=3.0" />
</head>
<body>

<div id="app">

  <!-- ═══════════════════════════════════════════════════ -->
  <!--  PLATFORM SELECTION SCREEN                         -->
  <!-- ═══════════════════════════════════════════════════ -->
  <div id="platform-screen" class="screen active">
    <div class="platform-hero">

      <div class="logo-wrap">
        <a href="https://instagram.com/freqyt" target="_blank" rel="noopener noreferrer" class="logo-link" title="Follow @freqyt on Instagram">
          <img src="logo.jpg" alt="FREQ Logo" class="logo-img" />
        </a>
      </div>

      <div class="platform-cards">
        <button class="platform-card" onclick="selectPlatform('windows')">
          <div class="platform-card-icon">
            <svg viewBox="0 0 24 24" width="48" height="48" fill="none">
              <rect x="1" y="1" width="10.2" height="10.2" rx="1.5" fill="#0078D4"/>
              <rect x="12.8" y="1" width="10.2" height="10.2" rx="1.5" fill="#0078D4"/>
              <rect x="1" y="12.8" width="10.2" height="10.2" rx="1.5" fill="#0078D4"/>
              <rect x="12.8" y="12.8" width="10.2" height="10.2" rx="1.5" fill="#0078D4"/>
            </svg>
          </div>
          <div class="platform-card-label">Windows</div>
          <div class="platform-card-sub">PC / Windows 10 & 11</div>
        </button>
        <button class="platform-card" onclick="selectPlatform('mac')">
          <div class="platform-card-icon">
            <svg viewBox="0 0 170 170" width="48" height="48" fill="currentColor">
              <path d="M150.37 130.25c-2.45 5.66-5.35 10.87-8.71 15.66-4.58 6.53-8.33 11.05-11.22 13.56-4.48 4.12-9.28 6.23-14.42 6.35-3.69 0-8.14-1.05-13.32-3.18-5.19-2.12-9.97-3.17-14.34-3.17-4.58 0-9.49 1.05-14.75 3.17-5.26 2.13-9.5 3.24-12.74 3.35-4.35.13-9.16-1.9-14.42-6.08-3.7-3.04-7.6-7.7-11.71-13.98-5.74-8.7-10.37-18.72-13.88-30.06-3.5-11.33-5.26-22.18-5.26-32.55 0-14.07 3.5-25.75 10.49-35.03 6.99-9.28 15.89-14.07 26.68-14.36 4.79 0 10.34 1.25 16.66 3.75 6.32 2.5 10.15 3.8 11.49 3.8 1.13 0 5.17-1.35 12.13-4.04 6.96-2.7 12.67-3.9 17.13-3.62 12.82.72 23.08 5.62 30.77 14.69-11.13 6.74-16.61 15.89-16.43 27.46.19 9.07 3.65 16.68 10.38 22.84 6.73 6.16 14.73 9.77 24 10.83-2.12 6.31-4.75 12.38-7.89 18.23zm-38.42-120.32c0 6.64-2.52 13.06-7.55 18.27-5.46 5.63-12.01 9.08-19.64 8.35-.11-.97-.16-1.93-.16-2.88 0-6.42 2.65-13.05 7.94-18.39 2.65-2.69 5.86-4.84 9.64-6.45 3.78-1.61 7.42-2.48 10.92-2.6.21 1.25.32 2.5.32 3.7z" fill="#ffffff"/>
            </svg>
          </div>
          <div class="platform-card-label">Mac</div>
          <div class="platform-card-sub">macOS / Apple Silicon & Intel</div>
        </button>
      </div>

    </div>
  </div>

  <!-- ═══════════════════════════════════════════════════ -->
  <!--  CATALOGUE SCREEN (CLEAN & MINIMAL)                 -->
  <!-- ═══════════════════════════════════════════════════ -->
  <div id="catalogue-screen" class="screen">

    <!-- COMPACT STICKY HEADER -->
    <header class="topnav">
      <button class="back-btn" onclick="goBack()" title="Back to Platforms">
        <svg class="home-svg" viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9.5L10 3.5L17 9.5V17C17 17.55 16.55 18 16 18H4C3.45 18 3 17.55 3 17V9.5Z"></path>
          <path d="M7.5 18V11H12.5V18"></path>
        </svg>
        <span>Home</span>
      </button>

      <div class="nav-center">
        <span class="nav-brand">Sounds List</span>
      </div>

      <div class="nav-right">
        <span id="current-platform-pill" class="platform-indicator-pill"></span>
      </div>
    </header>

    <!-- SLIM UNIFIED CONTROLS BAR (SEARCH + TABS) -->
    <div class="sticky-controls">
      <!-- Search Input -->
      <div class="search-bar-wrap">
        <div class="search-box">
          <span class="search-lens">🔍</span>
          <input
            type="text"
            id="search-input"
            class="clean-search-input"
            placeholder="Search plugins, bundles, DAWs..."
            oninput="handleSearch(this.value)"
            autocomplete="off"
            spellcheck="false"
          />
          <button
            id="search-clear-btn"
            class="search-clear-btn"
            onclick="clearSearch()"
            title="Clear search"
          >×</button>
        </div>
      </div>

      <!-- Clean Category Tabs -->
      <div class="category-tabs" id="category-tabs"></div>
    </div>

    <!-- MAIN PRODUCT LIST -->
    <main class="catalogue-main" id="catalogue-main"></main>

  </div>

  <!-- FLOATING ACTIONS (SEARCH & SCROLL TOP) -->
  <div class="floating-actions">
    <button id="floating-search-btn" class="floating-btn floating-search-btn" onclick="openFloatingSearch()" title="Search catalogue">
      🔍
    </button>
    <button id="scroll-top-btn" class="floating-btn scroll-top-btn" onclick="scrollToTop()" title="Back to top">
      ↑
    </button>
  </div>

  <!-- FLOATING ORDER CART BAR -->
  <div id="order-cart-bar" class="order-cart-bar">
    <div class="cart-upsell-banner" id="cart-upsell-banner" style="display:none"></div>
    <div class="cart-bar-inner">
      <div class="cart-left">
        <div class="cart-badge-icon">🛒</div>
        <div class="cart-summary">
          <div class="cart-count-line" id="cart-count">0 items selected</div>
          <div class="cart-total-line" id="cart-total">$0</div>
        </div>
      </div>
      <div class="cart-actions">
        <button class="cart-btn cart-btn-clear" onclick="clearCart()" title="Clear selection">✕</button>
        <button class="cart-btn cart-btn-copy" onclick="copyOrderList()" id="cart-copy-btn" title="Copy order text">
          <svg class="cart-btn-svg" viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="7" y="7" width="10" height="10" rx="2"></rect>
            <path d="M4 13V4C4 3.45 4.45 3 5 3H14"></path>
          </svg>
          <span id="cart-copy-text">Copy</span>
        </button>
        <button class="cart-btn cart-btn-order" onclick="sendOrderViaDM()" id="cart-order-btn" title="Send order via Instagram DM">
          <svg class="cart-btn-svg" viewBox="0 0 24 24" width="15" height="15" fill="currentColor">
            <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
          </svg>
          <span id="cart-order-text">Send on Instagram</span>
        </button>
      </div>
    </div>
  </div>

</div><!-- /#app -->

<!-- Scripts -->
<script src="config.js?v=3.0"></script>
<script src="data/windows.js?v=3.0"></script>
<script src="data/mac.js?v=3.0"></script>
<script src="storage.js?v=3.0"></script>
<script src="app.js?v=3.0"></script>
</body>
</html>
