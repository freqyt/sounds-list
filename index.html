<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Sounds List — Audio Software & Plugin Catalogue</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="app">

  <!-- ═══════════════════════════════════════════════════ -->
  <!--  PLATFORM SELECTION SCREEN                         -->
  <!-- ═══════════════════════════════════════════════════ -->
  <div id="platform-screen" class="screen active">
    <div class="platform-hero">

      <div class="logo-wrap">
        <img src="logo.jpg" alt="Sounds List Logo" class="logo-img" />
        <h1 class="logo-title">Sounds List</h1>
        <p class="logo-sub">Select your operating system to view available audio software & plugins.</p>
      </div>

      <div class="platform-cards">
        <button class="platform-card" onclick="selectPlatform('windows')">
          <div class="platform-card-icon">🪟</div>
          <div class="platform-card-label">Windows</div>
          <div class="platform-card-sub">PC / Windows 10 & 11</div>
          <div class="platform-card-cta">Browse Windows →</div>
        </button>
        <button class="platform-card" onclick="selectPlatform('mac')">
          <div class="platform-card-icon">🍎</div>
          <div class="platform-card-label">Mac</div>
          <div class="platform-card-sub">macOS / Apple Silicon & Intel</div>
          <div class="platform-card-cta">Browse Mac →</div>
        </button>
      </div>

    </div>
  </div>

  <!-- ═══════════════════════════════════════════════════ -->
  <!--  CATALOGUE SCREEN (CLEAN & MINIMAL)                 -->
  <!-- ═══════════════════════════════════════════════════ -->
  <div id="catalogue-screen" class="screen">

    <!-- COMPACT STICKY HEADER -->
    <header class="topnav">
      <button class="back-btn" onclick="goBack()" title="Change platform">
        ← <span id="platform-badge" class="platform-text"></span>
      </button>

      <div class="nav-center">
        <span class="nav-brand">Sounds List</span>
      </div>

      <div class="nav-right">
        <span id="quick-count" class="quick-count-pill"></span>
      </div>
    </header>

    <!-- SLIM UNIFIED CONTROLS BAR (SEARCH + TABS) -->
    <div class="sticky-controls">
      <!-- Search Input -->
      <div class="search-bar-wrap">
        <div class="search-box">
          <span class="search-lens">🔍</span>
          <input
            type="text"
            id="search-input"
            class="clean-search-input"
            placeholder="Search plugins, bundles, DAWs..."
            oninput="handleSearch(this.value)"
            autocomplete="off"
            spellcheck="false"
          />
          <button
            id="search-clear-btn"
            class="search-clear-btn"
            onclick="clearSearch()"
            title="Clear search"
          >×</button>
        </div>
      </div>

      <!-- Clean Category Tabs -->
      <div class="category-tabs" id="category-tabs"></div>
    </div>

    <!-- MAIN PRODUCT LIST -->
    <main class="catalogue-main" id="catalogue-main"></main>

    <!-- FLOATING SCROLL TO TOP -->
    <button id="scroll-top-btn" class="scroll-top-btn" onclick="scrollToTop()" title="Back to top">↑</button>

  </div>

</div><!-- /#app -->

<!-- Scripts -->
<script src="config.js"></script>
<script src="data/windows.js"></script>
<script src="data/mac.js"></script>
<script src="storage.js"></script>
<script src="app.js"></script>
</body>
</html>
